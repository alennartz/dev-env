# Podman configuration for sandbox environment
# See: https://github.com/containers/common/blob/main/docs/containers.conf.5.md

[containers]
# Use crun runtime (supports --cgroups=disabled, runc doesn't)
default_sysctls = []

[engine]
# crun is required for --cgroups=disabled support
runtime = "crun"

# Use native overlay storage driver
# (works with fuse-overlayfs fallback if needed)
[storage]
driver = "overlay"
