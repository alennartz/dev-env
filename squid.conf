# Squid Transparent Proxy Configuration
# Enforces domain whitelist for HTTP and HTTPS traffic

# Forward proxy port (required by Squid 6.x even when using intercept)
http_port 3127

# HTTP transparent intercept
http_port 3128 intercept

# HTTPS transparent intercept with SSL bump
https_port 3129 intercept ssl-bump \
    cert=/etc/squid/ssl/squid-ca.pem \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=16MB

# SSL certificate generation helper
sslcrtd_program /usr/lib/squid/security_file_certgen -s /etc/squid/ssl/ssl_db -M 16MB
sslcrtd_children 5

# ACL definitions
acl whitelist dstdomain "/etc/squid/whitelist.txt"
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# SSL bump configuration
# Step 1: Peek at the SNI to see the destination
acl step1 at_step SslBump1
ssl_bump peek step1

# Step 2: Bump (intercept) whitelisted domains, terminate others
ssl_bump bump whitelist
ssl_bump terminate all

# Access control
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow whitelist
http_access deny all

# Logging
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Disable caching (simplicity)
cache deny all

# Run as squid user
cache_effective_user squid
cache_effective_group squid

# Minimal memory usage
cache_mem 8 MB

# Required for Squid internal URLs to work properly
visible_hostname localhost
