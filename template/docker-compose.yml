# Claude Code Sandbox - Docker Compose Template
# Copy this folder to your project's .devcontainer/ directory

services:
  proxy:
    image: ghcr.io/alennartz/claude-sandbox-proxy:latest
    cap_add:
      - NET_ADMIN
    volumes:
      - squid-ssl:/etc/squid/ssl
      # Mount your whitelist (proxy only allows .anthropic.com by default)
      - ./whitelist.txt:/etc/squid/whitelist.txt:ro

  sandbox:
    # Option 1: Use base image directly (or :alpine for smaller image)
    image: ghcr.io/alennartz/claude-sandbox-base:latest

    # Option 2: Extend with your own Dockerfile
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    network_mode: "service:proxy"
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - NODE_EXTRA_CA_CERTS=/etc/squid/ssl/squid-ca-cert.pem
    volumes:
      - squid-ssl:/etc/squid/ssl:ro
      - ..:/workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-project}:cached
      # Mount Claude credentials to staging location (entrypoint copies with correct ownership)
      - ${HOME}/.claude/.credentials.json:/tmp/claude-creds/.credentials.json:ro
      - ${HOME}/.claude/settings.json:/tmp/claude-creds/settings.json:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/trust-proxy-ca.sh"]
    command: ["sleep", "infinity"]

volumes:
  squid-ssl:
